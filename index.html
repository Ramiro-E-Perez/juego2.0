<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cajas - Ludopatía</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: white; text-align: center; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #2b2b36; padding: 15px 30px; border-radius: 8px; margin-bottom: 20px; }
        .credits { font-size: 24px; font-weight: bold; color: #4caf50; }
        .roulette-wrapper { position: relative; width: 600px; height: 150px; margin: 0 auto 30px; background: #121215; border: 2px solid #333; overflow: hidden; border-radius: 8px; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
        .roulette-strip { display: flex; height: 100%; transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1); }
        .center-line { position: absolute; left: 50%; top: 0; width: 4px; height: 100%; background: #ffeb3b; transform: translateX(-50%); z-index: 10; box-shadow: 0 0 10px #ffeb3b; }
        .item { min-width: 120px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; border-right: 1px solid #333; background: #2a2a35; box-sizing: border-box; }
        .item img { width: 80px; height: 80px; object-fit: contain; }
        .item-name { font-size: 12px; margin-top: 5px; }
        .boxes { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        button { padding: 15px 25px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-box-1 { background: #e53935; color: white; }
        .btn-box-2 { background: #fb8c00; color: white; }
        .btn-box-3 { background: #1e88e5; color: white; }
        button:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.2); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2b2b36; padding: 30px; border-radius: 10px; border: 1px solid #555; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal h2 { margin-top: 0; }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn-keep { background: #4caf50; color: white; }
        .btn-sell { background: #e53935; color: white; }
        .inventory { background: #2b2b36; padding: 20px; border-radius: 8px; min-height: 150px; }
        .inventory-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
        .inv-item { width: 100px; background: #383845; padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Simulador de Apertura</h2>
        <div class="credits">Créditos: <span id="credit-display">100</span></div>
    </div>

    <div class="roulette-wrapper">
        <div class="center-line"></div>
        <div class="roulette-strip" id="roulette-strip"></div>
    </div>

    <div class="boxes">
        <button class="btn-box-1" onclick="openBox(50)" id="btn-50">Caja Élite (50 cr)</button>
        <button class="btn-box-2" onclick="openBox(20)" id="btn-20">Caja Rara (20 cr)</button>
        <button class="btn-box-3" onclick="openBox(5)" id="btn-5">Caja Común (5 cr)</button>
    </div>

    <div class="inventory">
        <h3>Tu Inventario</h3>
        <div class="inventory-grid" id="inventory-grid"></div>
    </div>

    <div class="modal" id="prize-modal">
        <h2>¡Obtuviste un Premio!</h2>
        <div id="prize-info" style="font-size: 20px; margin: 15px 0; font-weight: bold;"></div>
        <div class="modal-buttons">
            <button class="btn-keep" onclick="keepPrize()">Guardar en Inventario</button>
            <button class="btn-sell" onclick="sellPrize()">Vender por <span id="sell-value">0</span> cr</button>
        </div>
    </div>

    <script>
        let credits = 100;
        let inventory = [];
        let currentPrize = null;

        const prizes = Array.from({length: 20}, (_, i) => ({
            id: i + 1,
            name: `Skin de Arma ${i + 1}`,
            image: `https://via.placeholder.com/80/444444/FFFFFF?text=Arma+${i+1}`, 
            sellValue: Math.floor(Math.random() * 45) + 1
        }));

        const creditDisplay = document.getElementById('credit-display');
        const strip = document.getElementById('roulette-strip');
        const modal = document.getElementById('prize-modal');
        const invGrid = document.getElementById('inventory-grid');
        const buttons = document.querySelectorAll('.boxes button');

        function updateUI() {
            creditDisplay.innerText = credits;
            document.getElementById('btn-50').disabled = credits < 50;
            document.getElementById('btn-20').disabled = credits < 20;
            document.getElementById('btn-5').disabled = credits < 5;
        }

        function openBox(cost) {
            if (credits < cost) return;
            credits -= cost;
            updateUI();
            buttons.forEach(btn => btn.disabled = true);

            currentPrize = prizes[Math.floor(Math.random() * prizes.length)];
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0)';

            const totalItems = 50;
            const winningIndex = 45;
            
            for (let i = 0; i < totalItems; i++) {
                let p = (i === winningIndex) ? currentPrize : prizes[Math.floor(Math.random() * prizes.length)];
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.innerHTML = `<img src="${p.image}" alt="${p.name}"><div class="item-name">${p.name}</div>`;
                strip.appendChild(itemDiv);
            }

            strip.offsetHeight; 
            strip.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            
            const itemWidth = 120;
            const containerCenter = 600 / 2;
            const stopPosition = (winningIndex * itemWidth) - containerCenter + (itemWidth / 2);
            const randomOffset = (Math.random() * 40) - 20; 
            
            strip.style.transform = `translateX(-${stopPosition + randomOffset}px)`;

            setTimeout(() => { showModal(); }, 4200);
        }

        function showModal() {
            document.getElementById('prize-info').innerText = currentPrize.name;
            document.getElementById('sell-value').innerText = currentPrize.sellValue;
            modal.style.display = 'block';
        }

        function keepPrize() {
            inventory.push(currentPrize);
            renderInventory();
            closeModal();
        }

        function sellPrize() {
            credits += currentPrize.sellValue;
            closeModal();
        }

        function closeModal() {
            modal.style.display = 'none';
            updateUI();
        }

        function renderInventory() {
            invGrid.innerHTML = '';
            inventory.forEach(item => {
                const el = document.createElement('div');
                el.className = 'inv-item';
                el.innerHTML = `<img src="${item.image}" style="width:50px;"><div style="font-size:10px;">${item.name}</div>`;
                invGrid.appendChild(el);
            });
        }

        updateUI();
    </script>
</body>
</html>

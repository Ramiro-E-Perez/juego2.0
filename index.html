<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cajas - Ludopatía</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout Principal */
        .sidebar { width: 250px; background: #23232e; border-right: 2px solid #333; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .sidebar h3 { text-align: center; color: #ffca28; margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .history-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .history-item { background: #2a2a35; margin-bottom: 8px; padding: 10px; border-radius: 5px; font-size: 13px; border-left: 4px solid #4caf50; display: flex; justify-content: space-between; }
        .history-item .time { color: #888; font-size: 11px; }

        .main-content { flex-grow: 1; padding: 20px; overflow-y: auto; text-align: center; }

        /* Cabecera y Exhibidor de Colección */
        .header { display: flex; flex-direction: column; background: #2b2b36; padding: 15px 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-top h2 { margin: 0; color: #ffeb3b; text-shadow: 0 0 15px rgba(255, 235, 59, 0.4); font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .credits { font-size: 24px; font-weight: bold; color: #4caf50; background: #121215; padding: 5px 15px; border-radius: 5px; border: 1px solid #333; }
        
        .collection-showcase { display: flex; justify-content: center; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #555; }
        .collection-showcase img { width: 45px; height: 45px; object-fit: contain; background: #1e1e24; border-radius: 5px; border: 1px solid #444; padding: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); transition: 0.3s; }
        .collection-showcase img:hover { transform: scale(1.2); border-color: #ffeb3b; box-shadow: 0 0 10px #ffeb3b; cursor: help; }

        /* Ruleta */
        .roulette-wrapper { position: relative; width: 600px; height: 150px; margin: 0 auto 30px; background: #121215; border: 2px solid #333; overflow: hidden; border-radius: 8px; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
        .roulette-strip { display: flex; height: 100%; transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1); }
        .center-line { position: absolute; left: 50%; top: 0; width: 4px; height: 100%; background: #ffeb3b; transform: translateX(-50%); z-index: 10; box-shadow: 0 0 10px #ffeb3b; }
        .item { min-width: 120px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; border-right: 1px solid #333; background: #2a2a35; box-sizing: border-box; }
        .item-value { font-size: 13px; font-weight: bold; color: #ffca28; margin-bottom: 5px; }
        .item img { width: 70px; height: 70px; object-fit: contain; }
        .item-name { font-size: 12px; margin-top: 5px; }

        /* Cajas */
        .boxes { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        button { padding: 15px 25px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-box-1 { background: #e53935; color: white; }
        .btn-box-2 { background: #fb8c00; color: white; }
        .btn-box-3 { background: #1e88e5; color: white; }
        button:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.2); }

        /* Inventario */
        .inventory { background: #2b2b36; padding: 20px; border-radius: 8px; min-height: 150px; }
        .inventory-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
        .inv-item { width: 100px; background: #383845; padding: 10px; border-radius: 5px; text-align: center; position: relative; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .inv-item:hover { border-color: #e53935; background: #4a3b3b; transform: translateY(-3px); }
        .inv-item:hover::after { content: 'Clic para Vender'; position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: #e53935; color: white; padding: 3px 8px; border-radius: 3px; font-size: 10px; white-space: nowrap; z-index: 10; }

        /* Modales */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2b2b36; padding: 30px; border-radius: 10px; border: 1px solid #555; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.9); text-align: center; }
        .modal h2 { margin-top: 0; }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn-keep { background: #4caf50; color: white; }
        .btn-sell { background: #e53935; color: white; }

        /* Pantalla de Bancarrota */
        #bankrupt-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
        .bankrupt-content { background: #1a0000; border: 3px solid #ff1744; padding: 50px; border-radius: 15px; text-align: center; box-shadow: 0 0 50px rgba(255, 23, 68, 0.5); animation: pulse 2s infinite; }
        .bankrupt-content h1 { color: #ff1744; font-size: 40px; margin: 0 0 20px 0; text-transform: uppercase; }
        .bankrupt-content p { font-size: 18px; margin-bottom: 30px; }
        .btn-buy { background: #ffea00; color: #000; font-size: 24px; padding: 20px 40px; text-transform: uppercase; box-shadow: 0 5px 15px rgba(255, 234, 0, 0.4); }
        .btn-buy:hover { background: #fff59d; transform: scale(1.1); }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 23, 68, 0.3); }
            50% { box-shadow: 0 0 50px rgba(255, 23, 68, 0.6); }
            100% { box-shadow: 0 0 20px rgba(255, 23, 68, 0.3); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Historial de Compras</h3>
        <ul class="history-list" id="history-list">
            <!-- El historial se llenará aquí -->
        </ul>
    </div>

    <div class="main-content">
        
        <!-- NUEVA CABECERA CON EXHIBIDOR -->
        <div class="header">
            <div class="header-top">
                <h2>¡Colecciona todos los premios épicos y arma tu arsenal definitivo! 🚀🏆</h2>
                <div class="credits">Créditos: <span id="credit-display">100</span></div>
            </div>
            
            <div class="collection-showcase">
                <img src="arma1.png" alt="Premio 1" title="Premio 1">
                <img src="arma2.png" alt="Premio 2" title="Premio 2">
                <img src="arma3.png" alt="Premio 3" title="Premio 3">
                <img src="arma4.png" alt="Premio 4" title="Premio 4">
                <img src="arma5.png" alt="Premio 5" title="Premio 5">
                <img src="arma6.png" alt="Premio 6" title="Premio 6">
                <img src="arma7.png" alt="Premio 7" title="Premio 7">
                <img src="arma18.png" alt="Premio 18" title="Premio 18">
            </div>
        </div>

        <div class="roulette-wrapper">
            <div class="center-line"></div>
            <div class="roulette-strip" id="roulette-strip"></div>
        </div>

        <div class="boxes">
            <button class="btn-box-1" onclick="openBox(40, 5)" id="btn-40">Caja Élite - x5 (40 cr)</button>
            <button class="btn-box-2" onclick="openBox(25, 3)" id="btn-25">Caja Rara - x3 (25 cr)</button>
            <button class="btn-box-3" onclick="openBox(10, 1)" id="btn-10">Caja Común - x1 (10 cr)</button>
        </div>

        <div class="inventory">
            <h3>Tu Inventario (Clic para vender)</h3>
            <div class="inventory-grid" id="inventory-grid"></div>
        </div>
    </div>

    <!-- Modal de Premio -->
    <div class="modal" id="prize-modal">
        <h2>¡Obtuviste un Premio!</h2>
        <div id="prize-info" style="font-size: 20px; margin: 15px 0; font-weight: bold;"></div>
        <div class="modal-buttons">
            <button class="btn-keep" onclick="keepPrize()">Guardar en Inventario</button>
            <button class="btn-sell" onclick="sellPrize()">Vender por <span id="sell-value">0</span> cr</button>
        </div>
    </div>

    <!-- Pantalla de Bancarrota -->
    <div id="bankrupt-modal">
        <div class="bankrupt-content">
            <h1>¡Sin Créditos!</h1>
            <p>Te quedaste sin saldo y no tienes premios para vender.</p>
            <button class="btn-buy" onclick="buyCredits()">Comprar 100 Créditos</button>
        </div>
    </div>

    <script>
        let credits = 100;
        let inventory = [];
        let purchaseHistory = [];
        let currentPrize = null;
        let currentMultiplier = 1; 
        let currentItemActualValue = 0; 

        const prizes = [
            { id: 1, name: 'Premio 1', image: 'arma1.png', sellValue: 5, prob: 4 },
            { id: 2, name: 'Premio 2', image: 'arma2.png', sellValue: 50, prob: 2 },
            { id: 3, name: 'Premio 3', image: 'arma3.png', sellValue: 5, prob: 4 },
            { id: 4, name: 'Premio 4', image: 'arma4.png', sellValue: 10, prob: 7 },
            { id: 5, name: 'Premio 5', image: 'arma5.png', sellValue: 5, prob: 4 },
            { id: 6, name: 'Premio 6', image: 'arma6.png', sellValue: 3, prob: 6 },
            { id: 7, name: 'Premio 7', image: 'arma7.png', sellValue: 3, prob: 6 },
            { id: 8, name: 'Premio 8', image: 'arma8.png', sellValue: 5, prob: 4 },
            { id: 9, name: 'Premio 9', image: 'arma9.png', sellValue: 3, prob: 6 },
            { id: 10, name: 'Premio 10', image: 'arma10.png', sellValue: 3, prob: 6 },
            { id: 11, name: 'Premio 11', image: 'arma11.png', sellValue: 5, prob: 4 },
            { id: 12, name: 'Premio 12', image: 'arma12.png', sellValue: 3, prob: 6 },
            { id: 13, name: 'Premio 13', image: 'arma13.png', sellValue: 5, prob: 4 },
            { id: 14, name: 'Premio 14', image: 'arma14.png', sellValue: 10, prob: 7 },
            { id: 15, name: 'Premio 15', image: 'arma15.png', sellValue: 5, prob: 4 },
            { id: 16, name: 'Premio 16', image: 'arma16.png', sellValue: 3, prob: 6 },
            { id: 17, name: 'Premio 17', image: 'arma17.png', sellValue: 3, prob: 6 },
            { id: 18, name: 'Premio 18', image: 'arma18.png', sellValue: 50, prob: 2 },
            { id: 19, name: 'Premio 19', image: 'arma19.png', sellValue: 3, prob: 6 },
            { id: 20, name: 'Premio 20', image: 'arma20.png', sellValue: 3, prob: 6 }
        ];

        function getRandomPrize() {
            let randomNum = Math.random() * 100;
            let sum = 0;
            for (let i = 0; i < prizes.length; i++) {
                sum += prizes[i].prob;
                if (randomNum <= sum) {
                    return prizes[i];
                }
            }
            return prizes[0];
        }

        const creditDisplay = document.getElementById('credit-display');
        const strip = document.getElementById('roulette-strip');
        const modal = document.getElementById('prize-modal');
        const invGrid = document.getElementById('inventory-grid');
        const buttons = document.querySelectorAll('.boxes button');
        const bankruptModal = document.getElementById('bankrupt-modal');
        const historyList = document.getElementById('history-list');

        function updateUI() {
            creditDisplay.innerText = credits;
            document.getElementById('btn-40').disabled = credits < 40;
            document.getElementById('btn-25').disabled = credits < 25;
            document.getElementById('btn-10').disabled = credits < 10;
        }

        function checkBankrupt() {
            if (credits < 10 && inventory.length === 0) {
                bankruptModal.style.display = 'flex';
            }
        }

        function buyCredits() {
            credits += 100;
            
            const date = new Date();
            const timeString = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
            
            purchaseHistory.unshift({ amount: 100, time: timeString }); 
            renderHistory();

            bankruptModal.style.display = 'none';
            updateUI();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            purchaseHistory.forEach((compra, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                const buyNum = purchaseHistory.length - index;
                li.innerHTML = '<span>Compra #' + buyNum + ': +' + compra.amount + ' cr</span><span class="time">' + compra.time + '</span>';
                historyList.appendChild(li);
            });
        }

        function openBox(cost, multiplier) {
            if (credits < cost) return;
            credits -= cost;
            currentMultiplier = multiplier;
            updateUI();
            buttons.forEach(btn => btn.disabled = true);

            currentPrize = getRandomPrize();
            currentItemActualValue = currentPrize.sellValue * currentMultiplier; 
            
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0)';

            for (let set = 0; set < 3; set++) {
                for (let i = 0; i < prizes.length; i++) {
                    let p = prizes[i];
                    let pActualValue = p.sellValue * currentMultiplier; 
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    
                    itemDiv.innerHTML = '<div class="item-value">' + pActualValue + ' cr</div><img src="' + p.image + '" alt="' + p.name + '"><div class="item-name">' + p.name + '</div>';
                    strip.appendChild(itemDiv);
                }
            }

            const winningIndex = 40 + (currentPrize.id - 1);

            strip.offsetHeight;
            strip.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            
            const itemWidth = 120;
            const containerCenter = 600 / 2;
            const stopPosition = (winningIndex * itemWidth) - containerCenter + (itemWidth / 2);
            const randomOffset = (Math.random() * 40) - 20; 
            
            strip.style.transform = 'translateX(-' + (stopPosition + randomOffset) + 'px)';

            setTimeout(() => { showModal(); }, 4200);
        }

        function showModal() {
            document.getElementById('prize-info').innerText = currentPrize.name + " (x" + currentMultiplier + ")";
            document.getElementById('sell-value').innerText = currentItemActualValue;
            modal.style.display = 'block';
        }

        function keepPrize() {
            for(let i = 0; i < currentMultiplier; i++) {
                const invItem = {
                    uid: Date.now() + Math.random() + i,
                    name: currentPrize.name,
                    image: currentPrize.image,
                    finalValue: currentPrize.sellValue 
                };
                inventory.push(invItem);
            }
            
            renderInventory();
            closeModal();
            checkBankrupt();
        }

        function sellPrize() {
            credits += currentItemActualValue;
            closeModal();
            checkBankrupt();
        }

        function sellFromInventory(uid) {
            const itemIndex = inventory.findIndex(item => item.uid === uid);
            if (itemIndex > -1) {
                credits += inventory[itemIndex].finalValue; 
                inventory.splice(itemIndex, 1); 
                renderInventory();
                updateUI();
                checkBankrupt(); 
            }
        }

        function closeModal() {
            modal.style.display = 'none';
            updateUI();
        }

        function renderInventory() {
            invGrid.innerHTML = '';
            inventory.forEach(item => {
                const el = document.createElement('div');
                el.className = 'inv-item';
                el.onclick = function() { sellFromInventory(item.uid); };
                el.innerHTML = '<div style="color:#ffca28; font-weight:bold; font-size:11px; margin-bottom:3px;">' + item.finalValue + ' cr</div><img src="' + item.image + '" style="width:50px;"><div style="font-size:10px;">' + item.name + '</div>';
                invGrid.appendChild(el);
            });
        }

        updateUI();
        checkBankrupt(); 
    </script>
</body>
</html>
